[Gamepad]
; 1 = enabled (hooks are applied on top of the base Div2Patch payload)
Enable=1









; OS keyboard synthesis of the LEFT STICK (WASD).
; 0 (default) = native movement: the stick digitizes into the pad's
; virtual slots (StickVirt=1) and the native movement quartet moves the
; hero — no OS round-trip, the fastest path. The physical dpad is
; redirected away from those slots by the vset hook (§152), so it does
; not walk.
; 1 = movement through synthesized WASD keys (requires NativeMove=0;
; adds the OS input queue = noticeable latency).
Synth=0
; 1 = RT attacks via the native L3 slot (the old pre-clicks path).
; 0 (default) = RT/LT are OS mouse clicks: attack/confirm on RT,
; context on LT — and they select in menus, inventory and shops,
; where native acts do nothing. Both paths at once double-fire.
RTNative=0
; 1 = force the engine's XInput rumble controller (§158). Without it
; the PC build builds the DirectInput rumble variant, which cannot
; initialise force feedback on an XInput pad — the options screen shows
; "Unable to initialise rumble on a direct input device" and nothing
; vibrates. With 1 the game's own RumbleIntensity setting and rumble
; events drive XInputSetState.
Rumble=1

; Our own vibration (§159): the engine never creates its rumble
; controller on PC, and the in-game RumbleIntensity slider is NOT read
; by the PC build (it only writes settings.dv2, verified — the Wwise
; setter is never called). THIS is the control:
;   Vibration   = 0 disables the pulse entirely
;   VibStrength = motor power, percent 0..100 (low motor 0.6x of it,
;                 high motor 0.9x). Restart the game after editing.
Vibration=1
VibStrength=60

; §201: vibrate when the hero takes damage (red hit popup). 0 = off.
; VibDamageStrength: 0 = scale from VibStrength, else fixed percent.
VibOnDamage=1
VibDamageStrength=0

; §204: vibration at the START of a world load / area transition — a
; short pulse when the loading screen appears (no pulse on arrival).
; VibLoadStart: 0 = scale from VibStrength, else fixed percent.
VibLoad=1
VibLoadStart=0
Deadzone=9000
UserIndex=0

; verbose logging (off by default): raw pump events / dispatched actions
HookPump=0
HookDispatch=0

; 1 = OS-level keystrokes (keybd_event - the Steam overlay flickers
;     because the OS sees real key events). REQUIRED for in-world
;     movement: PostMessage (2) only reaches the message loop / menus,
;     the world reads the real keyboard state;
; 2 = PostMessage straight into the game window (menus only);
; 0 = legacy pump/PeekMessage (never works in the world, diag#16-#20)
Delivery=1

; right stick -> camera (OS mouse deltas)
RStickCam=1
CamSpeed=600
CamInvertY=0
; separate in-world camera speed (CamSpeed is now the menu cursor speed)
CamWorldSpeed=800
; M4-camera: 1 = zero the pad device's processed axis floats
; (pd+0x2C/+0x30/+0x34/+0x38) after Paddev::Update. Probe §140 showed
; these are the only pad state that moves with the physical stick.
ZeroPadAxes=1
; M4-camera: 1 = log input-state deltas (input manager / pad device
; fields) so a real pad press can be compared with our synthetic slot
; writes. Diagnostic only; keep 0 for play.
DumpInput=0
; M4-camera fix (§144): the engine aligns the camera behind the hero
; (mode-3 listener OnUpdate -> camera align 0x9F23A0) whenever its
; follow state resolves. A real pad button press triggers that align
; once, which the player sees as "every pad press recenters the
; camera". 1 = skip the align while no movement direction is active
; and a real DI8 pad event arrived in the last 200 ms. Moving, the
; keyboard/mouse and pure idling are untouched. 0 = stock behaviour.
CamHold=1
; M4-camera probe: log camera/input state on change (scheme flag
; 0x14F6055, scheme mode, camera pitch globals, injected look delta,
; listener direction bools, pad axes). Diagnostic only - the log is
; written line by line, so keep 0 for play.
CamProbe=0
; candidate fix #2: force the engine's "pad scheme active" byte
; (0x14F6055) to 0 every tick. 0 = off (default). Live-toggleable
; with the dbgcmd verb "schemeoff 0|1".
PadSchemeOff=0

; analog trigger button threshold, percent 0..100 (ON at this value,
; OFF at half of it — hysteresis; the raw XInput value flaps around a
; hard threshold and each flap would re-fire a click)
TriggerThreshold=60

; --- M2: native pad bindings ---
; 1 = after boot, apply native pad bindings automatically:
; 17 button binds + 12 axis binds (movement/camera), engine X360
; layout, into the alternate slot (keyboard stays as fallback)
PadDefaults=1
; reserved (no effect in this build)
PadDefaultsEngine=0
PadDefaultsClear=1
; how long to wait after the binding manager appears (profile load
; settles during this window), milliseconds
PadDefaultsDelayMs=15000
; log every engine Bind(action, token) call - shows when the game
; applies/reloads bindings at boot
LogBinds=1
; 1 = per-event trace lines (token:, btnmap:, fire:, b270:, d9x:).
; Each line is a separate fopen/fclose; during active play the trace
; generated ~170 lines/s and cost frame time. Keep 0 for playing,
; set 1 only when a new diagnostic run is needed.
Trace=0
; 1 = periodic diagnostic dumps (STATE/ACT/wd/T46/A48/AV/d95/setcur/
; cam/bind). They open+close the log file per line; keep 0 for play,
; set 1 only for a diagnostic run.
Diag=0
; 1 = file command console (dbgcmd\*.cmd) for autonomous tests
DbgCmd=0
; 1 = force the engine's "controller mode" flag (byte 0x14F18FC).
; Static RE (§179): this is the console (Xbox "Xenon") UI mode — pad
; bind table, console cursor in lists, _XBOX tutorial texts, XBOX HUD
; prompts, wider auto-aim. Save loads are fixed (§180): PadLoadFix=1
; keeps the PC loading screen, the mod clears the flag only for the
; load itself, then restores pad mode ~25 s after the world is up.
; Caveat: starting a NEW GAME while the flag is already on may
; black-screen (console new-game path) — set 0 for that, or start the
; game with 0 and toggle it later.
PadForceFlag=0
; 1 = keep the PC loading screen (GUI\Win32\loadingscreen.swf) even
; when the controller-mode flag is on (§180). In pad mode the engine
; otherwise asks for the console GUI\Xenon\loadingScreen.swf, which the
; PC build never renders: the save loads ("Загрузка прошла успешно!")
; but the black loading curtain is never lifted. 0 = old behaviour
; (only useful for reproducing the black screen).
PadLoadFix=1
; 1 = keep the controller-mode flag ON during save loads (§180). With
; PadLoadFix=1 the PC loading screen is used, so the load works; at 0
; the mod clears the flag at the load popup (the old safe behaviour)
; and the pad UI comes back only via the post-load re-force delay.
PadKeepOnLoad=0
; 1 = native console mode at boot (§181): the control-settings manager is
; constructed with controller type 4, so the engine itself sets
; 0x14F18FC and the whole console flag block before the UI initialises
; (closest to the Xbox build's own path). PadLoadFix still applies.
; 0 = PC mode at boot; use PadForceFlag for a late switch.
PadBootMode=0
; 1 = also preload the console (Xenon) GUI movie set (§183). The GUI
; bundle loader normally loads 50 Win32 movies when pad mode is off; in
; pad mode it loads 10 Xenon ones instead (hud, menuOverview, save,
; popup, dialog, chest, inventory_revamp, hitDamage, options,
; waypointShrine). This patch keeps the Win32 bundle and APPENDS those
; 10 Xenon movies, so the engine's console-mode UI can find them without
; breaking save loads. Requires the Xenon assets in a pack
; (Data\Win32\Packed\Patch.dv2, see NOTES-input §182-§183).
; 2 = swap ONLY GUI\Win32\hud.swf -> GUI\Xenon\hud.swf (isolates the
; console HUD test from duplicate-movie problems).
; Experimental; 0 = stock loader. §183: mode 1 hung the save load.
XenonBundle=0
; §184: console UI via screen-id remapping. The UI factory FUN_00a80c90
; maps a screen id to a class; PC and console screens are DIFFERENT ids
; (e.g. menuOverview: PC 0x4A, Xenon 0x2C; inventory: PC 0x4B, Xenon
; 0x14). Hooking the generic create wrapper FUN_0077d640 lets the mod
; rewrite the id while the pad flag is on.
;   1 = log every created screen id (diagnostic; shows what opens what)
;   2 = remap wrapper id (PC -> Xenon) when the pad flag is on
;   3 = remap only the factory argument (keeps the PC id in the registry)
;   4 / 5 = same two modes but always (ignore the pad flag)
; Requires the Xenon assets in Data\Win32\Packed\Patch.dv2.
; Live switch without restart: dbgcmd verb "xenonui N".
; Experimental; 0 = off.
XenonUi=0
; 1 = force the engine's pad query object (paddev) into pad mode
; (mode 2: [paddev+0x4C], device index [paddev+0x48]). In pad mode
; the engine fills its query-side axis pairs from the live pad every
; frame. 0 = only observe (log mode/pairs) without forcing.
PadMode=1
; diag#70: force the pad into mode 2 even when the game switches it
; to mode 3 ("no pad" - the state it uses in menus on PC). While the
; pad is in mode 3 the menus see no buttons at all (Start cannot
; close the menu, the D-pad does not navigate). Set 0 to restore the
; old behaviour (do not fight mode 3).
ForceMenu=1
; 1 = repair the missing out-range calibration of the left-stick
; channels (0/1) by copying it from the working right-stick channels
; (2/3). The pad constructor never writes the out-range for channels
; 0/1 on PC, so their processed values stay 0 without this.
CalibFix=1
; 1 = the mod itself ticks the engine's pad movement collector AFTER
; the engine's input tick body. diag#25c VERDICT: the collector call
; runs and returns OK, but corrupts memory (handle 0x293 resolves to
; a non-avatar entity) and the game crashes a frame later. Keep 0
; until the avatar handle is identified properly.
RunCollectors=0
; 1 = also tick the camera collector (0xA8B780). Keep 0 until the
; movement one is proven - one variable at a time.
RunCamC=0


; --- diag#49: NATIVE MOVEMENT TEST (Synth=0, no OS keys at all) ---
; 1 = call the engine's own MoveCollector tick (MOVC 0xA8B620) once per
; frame from the game thread (pup hook). MOVC reads the action values
; gav(0..3) (forward/back/strafe) and drives the avatar's move
; controller through the engine's own apply 0xA8BA00.
MoveTick=0
; !!! KEEP 0. diag#54 proved the engine DOES fill the paddev query
; pairs with the real stick values (in percent: -57, -49) and
; GetAxisValue rectifies them into half-axes (idx0/idx2 = positive,
; idx1/idx3 = negative). Our injection OVERWROTE those correct
; values with garbage from the dead channel array - that was the
; reason the hero never moved. The option stays only as a scaler
; experiment (it needs the scale fixed first).
AxisInject=0
; dead zone for the injected axes, in raw percent (-100..100)
AxisDead=10
; 1 = let the native X360 camera path run too (MOVC's second call).
; Keep 0 on PC: the camera is mouse driven there and the native
; camera write fights the mouse (the camera feels sluggish).
MoveCam=0
; 1 = extra engine calls inside the tick (GetAxisValue + the move
; controller). They are diagnostics only and one of them (the entity
; vtable slot +0x58) turned out to have a different calling
; convention - keep 0 unless the game is stable.
MTProbe=1
; bit0 = invert X, bit1 = invert Y (if the hero walks backwards /
; sideways, flip here instead of rebuilding)
AxisFlip=0
; 1 = digitize the stick into the pad's virtual D-pad slots — the
; carrier slots of the native movement quartet. Required with
; NativeMove=1 (default). 0 = off (only for the WASD path). §152: the
; physical dpad's own writes into these slots are redirected by the
; vset hook, so the dpad no longer walks while the stick still moves.
StickVirt=1
; 1 (default) = movement through the native virtual-slot quartet
; (MoveVirt) — fastest. 0 = movement through OS WASD rows (Synth=1
; required) and native Quickmap 5-8 binds on the freed dpad slots
; (§151 fallback; adds input latency).
NativeMove=1
; diag#65: where the stick values come from.
;   0 = auto (XInput left stick when the pad is seen, else the DI8
;       raw channels 0/1 - the DI8 layout was never proven, so the
;       "swapped sticks" report could not be resolved on PC)
;   1 = force DI8 channels, 2 = force XInput
StickSrc=0
; diag#73: stick digitize threshold, percent of +-100. 20 was too
; small: the stick rests at -15..-25 after releasing a direction,
; flapped around the threshold and the engine latched the last
; direction (the hero kept running). Raise if the hero still sticks,
; lower if the response feels sluggish.
StickDead=35
; diag#86c: 1 = auto-arm the page-guard on the diagonal-release
; signature during play. OFF by default: capturing BOTH pages
; (slots + move-controller) killed the game <1 s after arming in
; two real sessions (diag#86a/86b). Prefer the dbgcmd console:
; "armguard" (slots page only - safe) or "armguard2" (both pages -
; dangerous, deliberate experiments only).
GuardAuto=0
; diag#88 v2 (verdict 106 + correction 108): sticky-hero FIX.
; The latched movement magnitude is ANALOG slot 0x12 (18 decimal)
; of the pad slot array: the engine ramps it per input event with
; acceleration and a perfectly centered stick (no jitter) can
; freeze it - the hero kept running. While the stick is parked the
; mod replays the engine's own hard release (vclr) for that slot
; every frame. Slot 0xC (L3/RT-attack carrier) is not touched.
; 1 = on, 0 = off.
StickyFix=1
; diag#90 v2 (verdict hunt 115): the prime suspect for the sticky
; hero is the river of tiny type-4 mouse-delta tokens the game emits
; while the stick rests. While the stick is parked (and not in a
; menu) the mod DROPS small delta tokens (|dx|<=8) at the action
; GATEWAY (0x8E7710, where every token passes - the switch 0x8E7660
; sees almost nothing, v1 lesson); real mouse gestures (large
; deltas) always pass. Watch "d90: drop river" lines in
; div2gamepad.log. 1 = on, 0 = off.
RiverFix=1
; diag#87: motor probes (always on, rate-capped logging). m1 hooks
; the movement motor 0x8FEA00 and dumps the ctrl state + command
; queues (flags STICKY when direction has been zero >600 ms while
; the motor runs); m2/m3 hook the direction/target virtual dispatch
; (0x8FDF6D / 0x8FEAB3) and log the concrete callee implementors.
; No config needed - watch "m1:/m2:/m3:" lines in div2gamepad.log.
; diag#89: m6 hooks the move-to-target executor 0x6EFD90 (the
; gamepad-mode steering driver 0x75AA40 feeds it a world-space target
; every frame; sticky hero = stale far target). m6 logs both position
; trios + the DAT_014EF900 global - watch "m6:" lines; during a stuck
; episode the tgt= trio should freeze while the hero keeps running.
; No config needed.
; diag#67: the four CANONICAL X360 button ids bound to the movement
; actions (U,D,L,R order). Measured fact (btnmap): the g1 bind idx is
; the CANONICAL id (0=A 1=B 2=Y 3=X 4=Back 5=Start 6=LB 7=RB
; 8=L 9=R 10=U 11=D 12=L3 13=R3), and the engine polls the pad's
; virtual array through the canonical->slot table
; (A->9 B->B Y->8 X->A Back->F Start->E LB->4 RB->6 dpad->2,3,0,1
; L3->C R3->D). Default 10,11,8,9 = the D-pad: the stick digitizes
; into the D-pad slots, so the physical D-pad also walks (console
; behavior). Only used when NativeMove=1.
MoveVirt=10,11,8,9

[Layout]
; Default gamepad layout = X360 console layout (§150), translated to the
; game's own PC actions:
;   A=Quickmap 3, B=Quickmap 2, Y=Quickmap 1, X=Quickmap 4,
;   LB=Interact/dash, RB=Jump, L3=Draw/sheathe weapon,
;   R3=Tactical pause, Start=ESC, Back=Map,
;   Dpad=Quickmap 5/6/7/8, RT=LMB (attack/select), LT=RMB (context).
; Native binds (PadDefaults) cannot be overridden here — this section
; only overrides the OS-synthesis rows (Synth=1 or the dpad rows):
;   value = virtual-key code (decimal or 0xNN), or LMB / RMB, or NONE.
; R3Double: if set (VK code), R3 double-tap (<350ms) sends this key
; instead of the R3 key (e.g. 0x47=G with "cancel lock" bound to G).
R3Double=0
;B=0x50
;A=0x20
;X=NONE
;RT=0x58

